version: '2.1'
orbs:
  techdocs: datacamp/techdocs@0.0.1
  go: circleci/go@1.7.3
jobs:
  build:
    executor:
      name: go/default
      tag: '1.12'
    steps:
      - checkout
      - run:
          command: |
            sudo apt update
            sudo apt install ca-certificates libgnutls30 -y
            #The certificate for go.opencensus.io has expired but is necessary to be able to build
            go get -insecure 
            go build .
          environment:
            GOOS: linux
            GOARCH: amd64
      - store_artifacts:
          path: ./terraform-provider-kong
workflows:
  main:
    jobs:
      - build
  techdocs:
    jobs:
      - techdocs/publish:
          name: techdocs-staging
          context: org-global
          environment: staging
          filters:
            branches:
              ignore: [master, main]
      - techdocs/publish:
          name: techdocs-prod
          context: org-global
          environment: prod
          filters:
            branches:
              only: [master, main]
